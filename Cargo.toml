[workspace]
members = ["crates/jmds-api", "crates/jmds-core", "crates/jmds-tui"]
resolver = "3"

# Versions shared by more than one crate, so the lockfile holds one of each. Members pull them
# in with `{ workspace = true }` and add features where they need them.
[workspace.dependencies]
color-eyre = "0.6.5"
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "7.0.0"
futures-util = { version = "0.3.33", default-features = false, features = ["std"] }
log = { version = "0.4.33", features = ["serde", "std"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "stream", "json"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
toml_edit = { version = "0.25.15", features = ["serde"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "local-time", "tracing-log"] }
unicode-width = "0.2.2"

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
opt-level = 3
strip = true
lto = true
panic = "abort"
codegen-units = 1
