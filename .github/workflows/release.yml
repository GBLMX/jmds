name: Release

on:
  push:
    tags:
      - "v[0-9]+.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 自用：只出本机要用的这一个目标。`install.sh` 自己会按平台拼资产名，加目标时
        # 往这张表里加一行即可（它的平台探测早就写着其它三元组）。
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czvf ../../../jmds-${{ matrix.target }}.tar.gz jmds
          cd -

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: jmds-${{ matrix.target }}
          path: jmds-${{ matrix.target }}.tar.gz

  release:
    name: publish release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate release notes
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          git-cliff --latest --tag "$VERSION" -o release-notes.md

      - name: Checksums
        # 一份给安装脚本校验的文件：不必让人从发布页上抄哈希下来。名字不带路径前缀（资产就摆在
        # 发布根上），且排序，所以这个文件本身可复现。
        run: |
          cd artifacts
          find . -type f -name 'jmds-*.tar.gz' -exec sha256sum {} + \
            | sed -E 's|^([0-9a-f]{64})  \./[^/]+/|\1  |' \
            | sort -k2 \
            > SHA256SUMS
          cat SHA256SUMS

      - name: Upload release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/SHA256SUMS
            artifacts/jmds-*/jmds-*
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
